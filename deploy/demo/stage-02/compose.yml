services:
  opa:
    image: openpolicyagent/opa:1.20.2-static@sha256:bb245e9e36be0d0ed486c240b606c56be7aba96014a4a87895fed4ba7a6dfa8d
    command:
      - run
      - --server
      - --addr=0.0.0.0:8181
      - --min-tls-version=1.2
      - --tls-cert-file=/runtime/tls/localhost.pem
      - --tls-private-key-file=/runtime/tls/localhost.key
      - --verification-key=/runtime/opa/public.pem
      - --verification-key-id=demo-opa-signing-01
      - --bundle
      - /runtime/opa/bundle.tar.gz
    ports:
      - "127.0.0.1:8181:8181"
    volumes:
      - ../../../.runtime/integration-demo-stage-02:/runtime:ro
    read_only: true
    tmpfs:
      - /tmp
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL

  postgres:
    image: postgres:18.6-bookworm@sha256:1c59e2c3c818eaa0f0628f695b36e7c9e362d6b219b36a54a32df645cbd7e1af
    environment:
      POSTGRES_DB: geaip_demo
      POSTGRES_USER: geaip_demo
      POSTGRES_PASSWORD: ${GEAIP_DEMO_POSTGRES_PASSWORD:?GEAIP_DEMO_POSTGRES_PASSWORD is required}
    entrypoint: ["/bin/bash", "-ec"]
    command:
      - |
        cp /runtime/tls/localhost.pem /var/lib/postgresql/server.crt
        cp /runtime/tls/localhost.key /var/lib/postgresql/server.key
        chown postgres:postgres /var/lib/postgresql/server.crt /var/lib/postgresql/server.key
        chmod 600 /var/lib/postgresql/server.key
        exec docker-entrypoint.sh postgres -c ssl=on -c ssl_cert_file=/var/lib/postgresql/server.crt -c ssl_key_file=/var/lib/postgresql/server.key
    ports:
      - "127.0.0.1:5433:5432"
    volumes:
      - ../../../.runtime/integration-demo-stage-02:/runtime:ro
      - ../../../backend/Platform.SoftwareFactory/Persistence/Migrations/001_governed_intent_registration.sql:/docker-entrypoint-initdb.d/001_governed_intent_registration.sql:ro
      - geaip-stage-02-postgres:/var/lib/postgresql
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    cap_add:
      - CHOWN
      - DAC_OVERRIDE
      - FOWNER
      - SETGID
      - SETUID

volumes:
  geaip-stage-02-postgres:
