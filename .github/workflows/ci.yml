name: Governed CI

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  verify-build-attest:
    runs-on: windows-latest
    permissions:
      contents: read
      id-token: write
      attestations: write
    steps:
      - name: Checkout immutable source
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Install approved .NET SDK
        uses: actions/setup-dotnet@67a3573c9a986a3f9c594539f4ab511d57bb3ce9 # v4
        with:
          global-json-file: global.json

      - name: Restore
        shell: pwsh
        run: dotnet restore .\GovernmentEnterpriseAIPlatform.sln --locked-mode

      - name: Verify and build
        shell: pwsh
        run: .\scripts\verify-project.ps1

      - name: Publish governed artifacts
        shell: pwsh
        run: |
          dotnet publish .\backend\Platform.Api\Platform.Api.csproj -c Release --no-restore -o .\artifacts\api
          dotnet publish .\frontend\Platform.Web\Platform.Web.csproj -c Release --no-restore -o .\artifacts\web
          Compress-Archive -Path .\artifacts\api, .\artifacts\web -DestinationPath .\artifacts\government-enterprise-ai-platform.zip

      - name: Generate CycloneDX SBOM
        shell: pwsh
        run: .\scripts\generate-sbom.ps1

      - name: Generate checksums and provenance record
        shell: pwsh
        run: |
          $artifact = '.\artifacts\government-enterprise-ai-platform.zip'
          $digest = (Get-FileHash -LiteralPath $artifact -Algorithm SHA256).Hash.ToLowerInvariant()
          "sha256:$digest  government-enterprise-ai-platform.zip" | Set-Content .\artifacts\checksums.txt
          [ordered]@{
            repository = '${{ github.repository }}'
            commit = '${{ github.sha }}'
            workflow = '${{ github.workflow }}'
            runId = '${{ github.run_id }}'
            artifactDigest = "sha256:$digest"
          } | ConvertTo-Json | Set-Content .\artifacts\provenance.json

      - name: Sign build provenance attestation
        if: github.event_name == 'push'
        uses: actions/attest@f7c74d28b9d84cb8768d0b8ca14a4bac6ef463e6 # v4.2.0
        with:
          subject-path: artifacts/government-enterprise-ai-platform.zip

      - name: Sign SBOM attestation
        if: github.event_name == 'push'
        uses: actions/attest@f7c74d28b9d84cb8768d0b8ca14a4bac6ef463e6 # v4.2.0
        with:
          subject-path: artifacts/government-enterprise-ai-platform.zip
          sbom-path: artifacts/sbom.cdx.json

      - name: Upload governed build evidence
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: governed-build-${{ github.sha }}
          path: artifacts/
          if-no-files-found: error
          retention-days: 14
